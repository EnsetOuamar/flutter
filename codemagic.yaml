workflows:
  android-apk:
    name: Android release APK
    environment:
      flutter: stable
    scripts:
      - name: Regenerate Android platform
        script: flutter create --platforms=android --project-name meter_collector .
      - name: Set Android compile SDK
        script: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i '' 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i '' 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
          fi
      - name: Install Flutter packages
        script: flutter pub get
      - name: Build Android APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
